<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#161d2b" />
    <meta
      name="description"
      content="See what the community really thinks of your favorite games. Check player ratings and drop your review in seconds."
    />
    <title>GG Rate</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;800&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main>
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero__wall" aria-hidden="true"></div>

        <div class="hero__content">
          <h1 class="hero__title" id="hero-title">
            <span class="hero__title-gg">GG</span>
            <span class="hero__title-rate">Rate</span>
          </h1>

          <p class="hero__text">
            See what the community really thinks of your favorite games.
            Browse thousands of Steam titles, check player ratings, and drop
            your review in seconds. No account needed.
          </p>

          <dl class="hero__stats">
            <div class="stat stat--games">
              <dt>Available games</dt>
              <dd>105,000+</dd>
            </div>
            <div class="stat stat--reviews">
              <dt>Player reviews</dt>
              <dd>1,000,000+</dd>
            </div>
          </dl>

          <a class="button" href="#games">Explore games</a>
        </div>
      </section>
    </main>
  </body>
</html>
