<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.form.css">
    <title>Test form put to db</title>
</head>
<body>
    <div class="form">
        <form id="review-form">
            <label for="steamuser">Steam username:</label>
            <input type="text" name="steamuser" id="steamuser" placeholder="Mike90">

            <label for="game">Select game:</label>
            <select name="game" id="game" required>
                <option selected disabled value="">Select game:</option>
                <option value="fortnite">Fortnite</option>
                <option value="arc-raiders">Arc Raiders</option>
                <option value="assassins-creed-mirage">Assassin's Creed Mirage</option>
                <option value="call-of-duty-mw4">Call of Duty MW4</option>
                <option value="euro-truck-simulator-2">Euro Truck Simulator 2</option>
                <option value="minecraft">Minecraft</option>
                <option value="satisfactory">Satisfactory</option>
                <option value="subnautica">Subnautica</option>
                <option value="watch-dogs-2">Watch Dogs 2</option>
            </select>

            <label for="stars">Stars /5:</label>
            <input type="number" name="stars" id="stars" placeholder="5">

            <label for="description">Descrire your rewies:</label>
            <input type="text" name="description" id="description" placeholder="I like this game beacause...">

                        <br>
            <button type="submit">Submit my rewies</button>
        </form>
            

    </div>

</body>
</html>

<script>

    async function pushReviews(e) {
    e.preventDefault();

    const steamuser = document.querySelector('[name="steamuser"]').value;
    const game = document.querySelector('[name="game"]').value;
    const stars = document.querySelector('[name="stars"]').value;
    const description = document.querySelector('[name="description"]').value;

    const body = new URLSearchParams({ steamuser, game, stars, description });

    const response = await fetch('/test', {
        method: 'POST',
        body,
    });

    const result = await response.json();
    console.log(result);
    }

    document.getElementById('review-form').addEventListener('submit', pushReviews);


  loadReviews();
</script>
