<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.games.css">
    <title>Game - Library</title>
</head>
<body>

    <nav>
        <a href="/">
            <img class="logo" src="assets/icon/logo.png" alt="logo">
        </a>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/games.html">Games</a></li>
            <li><a href="#">Contact</a></li>
            <li><a href="#">About</a></li>
        </ul>

    </nav>

    <div class="hero">
        <img class="" src="assets/assassins.jpg" alt="">

        <div class="hero-section">
            <h1>assassins-creed-mirage reviews</h1>
            <p>Here you can see assassins-creed-mirage rewies</p>

            <a href="#reviews">SEE REVIEWS</a>
        </div>

    </div>

<section class="library-hero">
    <h1>Game previews</h1>

    <div class="library-img">
        <img src="assets/assassins-creed-mirage/assassins-creed-mirage1.avif" alt="assassins-creed-mirage screenshot 1">
        <img src="assets/assassins-creed-mirage/assassins-creed-mirage2.avif" alt="assassins-creed-mirage screenshot 2">
        <img src="assets/assassins-creed-mirage/assassins-creed-mirage3.jpg" alt="assassins-creed-mirage screenshot 3">
    </div>
</section>




    <h2 class="section-title">Latest reviews</h2>
    <div id="reviews" class="reviews"></div>

<section class="cta">
    <h2>Send review for this game</h2>
    <p>Played assassins-creed-mirage? Share your experience with the community.</p>

    <a href="/vote.html" class="cta-btn">Write a review</a>
</section>

    <script>
        const gameNames = {
            'assassins-creed-mirage': 'Assassins creed mirage',
        };

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str ?? '';
            return div.innerHTML;
        }

        async function loadReviews() {
            const response = await fetch('/reviews?game=assassins-creed-mirage');
            const reviews = await response.json();

            const container = document.getElementById('reviews');
            container.innerHTML = '';

            if (reviews.length === 0) {
                container.innerHTML = '<p>No reviews yet.</p>';
                return;
            }

            reviews.forEach((review) => {
                const stars = Number(review.stars) || 0;
                const gameName = gameNames[review.game] || review.game;

                const card = document.createElement('div');
                card.className = 'review-card';
                card.innerHTML = `
                    <div class="review-header">
                        <h3>${escapeHTML(review.steamuser)}</h3>
                        <span class="review-stars">${'★'.repeat(stars)}${'☆'.repeat(5 - stars)}</span>
                    </div>
                    <p class="review-game">${escapeHTML(gameName)}</p>
                    <p>${escapeHTML(review.description)}</p>
                `;
                container.appendChild(card);
            });
        }

        loadReviews();
    </script>

</body>
</html>
